# OpenAI's open-weight gpt-oss-20b, run locally through Ollama (install first: ollama pull gpt-oss:20b, ~14 GB).
# It does not fit in 4 GB of graphics memory, so it runs mostly on the processor: expect ~1-3 min per analysis.
# gpt-oss always reasons before answering; "low" is its lowest level. Reasoning counts toward max_tokens.
experiment_id: ollama-gptoss-ping
cases: [IN-THEFT-001]
prompt_version: v2
models:
  - {key: gptoss20b, provider: ollama, model: "gpt-oss:20b", thinking: low, num_ctx: 8192, max_tokens: 2000, timeout_s: 900}
runs: 3
seed: 13
budget: {max_usd: 0, max_calls: 20}
conditions:
  - {id: baseline}
