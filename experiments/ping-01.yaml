# Stage A: one baseline call per model - checks auth, structured output and parsing (3 calls).
# Prices (USD / 1M tokens): Haiku 5.5 from Anthropic's model table (2026-10-06); gpt-5.4-nano from
# developers.openai.com/docs/models/gpt-5.4-nano; gemini-3.5-flash-lite from a third-party guide
# (mem0.ai, unconfirmed by Google; $0 on the free tier) - treat its cost as an upper bound.
experiment_id: ping-01
cases: [IN-THEFT-001]
prompt_version: v2
models:
  - {key: claude, provider: anthropic, model: claude-haiku-5-5, thinking: false, rpm: 5, max_tokens: 1000, price_in: 0.10, price_out: 0.50}
  - {key: gpt,    provider: openai,    model: gpt-5.4-nano-2026-03-17, effort: none, rpm: 5, max_tokens: 1000, price_in: 0.20, price_out: 1.25}
  - {key: gemini, provider: gemini,    model: gemini-3.5-flash-lite, effort: minimal, rpm: 5, max_tokens: 1000, price_in: 0.30, price_out: 2.50}
runs: 1
seed: 101
budget: {max_usd: 0.10, max_calls: 12}
conditions:
  - {id: baseline}
