# Pilot spec. Each condition differs from its `ref` in one evidence item (checked by `validate`).
# Before a live run: replace the TODO model ids with current dated ids and fill in prices (USD per 1M tokens).
experiment_id: pilot-01
cases: [IN-THEFT-001]
prompt_version: v1
models:
  - {key: claude, provider: anthropic, model: claude-sonnet-5-5, max_tokens: 8000, price_in: 2.0, price_out: 10.0}
  - {key: gpt,    provider: openai,    model: TODO-openai-model-id, max_tokens: 8000}
  - {key: gemini, provider: gemini,    model: TODO-gemini-model-id, max_tokens: 8000}
runs: 20
seed: 20261022
order: randomize_within_side
budget: {max_usd: 30, max_calls: 4000}
conditions:
  - {id: baseline}
  # presence
  - {id: add_bank,      factor: presence,  level: added,   ops: [{add: E03}]}
  - {id: rm_motive,     factor: presence,  level: removed, ops: [{remove: E04}]}
  - {id: add_fsl,       factor: presence,  level: added,   ops: [{add: E05}]}
  # H2 wording (content held constant)
  - {id: E01_formal,    factor: wording,   level: formal_register,   ops: [{variant: {E01: formal}}]}
  - {id: fsl_percent,   factor: wording,   level: percentage_format, ref: add_fsl, ops: [{variant: {E05: percent}}]}
  # credibility attributes
  - {id: E01_lowrel,    factor: reliability,    level: low,    ops: [{variant: {E01: low_reliability}}]}
  - {id: E01_enmity,    factor: potential_bias, level: enmity, ops: [{variant: {E01: enmity}}]}
  # H1 category swap (same fact: accused entered the shop at about 22:30)
  - {id: swap_cctv,       factor: category, level: electronic, ops: [{replace: {E01: E11}}]}
  - {id: swap_admission,  factor: category, level: confession, ops: [{replace: {E01: E12}}]}
  # H3 corroboration: 2x2 (eyewitness A = E01 x CCTV B = E02), plus dependent corroboration
  - {id: corr_indep,    factor: corroboration, level: A_and_B,         ops: [{add: E02}]}
  - {id: rm_eyewitness, factor: corroboration, level: not_A,           ops: [{remove: E01}]}
  - {id: cctv_only,     factor: corroboration, level: B_without_A, ref: rm_eyewitness, ops: [{add: E02}]}
  - {id: corr_dep,      factor: corroboration, level: dependent,       ops: [{add: E08}]}
  # H4 contradiction
  - {id: contra_cred,       factor: contradiction, level: credible,   ops: [{add: E09}]}
  - {id: contra_interested, factor: contradiction, level: interested, ref: contra_cred, ops: [{variant: {E09: interested}}]}
  # H5 order (focal item pinned first vs last within the prosecution case)
  - {id: E01_first,     factor: order, level: first, ops: [{position: {E01: first}}]}
  - {id: E01_last,      factor: order, level: last,  ref: E01_first, ops: [{position: {E01: last}}]}
  # controls and exploratory probes
  - {id: neutral_item,  factor: control,       level: neutral_filler, ops: [{add: E10}]}
  - {id: police_conf,   factor: admissibility, level: inadmissible,   exploratory: true, ops: [{add: E13}]}
